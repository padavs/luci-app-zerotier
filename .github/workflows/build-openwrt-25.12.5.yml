name: Build OpenWrt 25.12.5 APK

# One entry point, two paths:
#   rebuild=false (default)  publish an existing build artifact, ~1 minute
#   rebuild=true             compile first, then publish, ~17 minutes
# The build job also runs on its own when only the APK artifact is wanted.

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild the APK first (~17 min). Leave false to only publish an existing build."
        type: boolean
        default: false
      run_id:
        description: "Build run id to publish when rebuild=false (empty = latest successful build run that has the artifact)"
        required: false
        default: ""
      tag:
        description: "Release tag (empty = derived from the APK name, e.g. v2.2-r31)"
        required: false
        default: ""

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.5"
  OPENWRT_TARGET: "mediatek"
  OPENWRT_SUBTARGET: "filogic"
  EXPECTED_SOURCE_COMMIT: "c6a223b58e91115ee37812cad6a1b1b54ca0874d"
  SDK_FILE: "openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
  ARTIFACT_NAME: "luci-app-zerotier-openwrt-25.12.5"

jobs:
  build:
    if: ${{ inputs.rebuild }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout fixed source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify audited package source
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e "${EXPECTED_SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_SOURCE_COMMIT" HEAD
          git diff --quiet "$EXPECTED_SOURCE_COMMIT" HEAD -- \
            Makefile htdocs root po LICENSE

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            file \
            wget \
            zlib1g-dev \
            zstd

      - name: Download and verify official SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"

          wget -O "$SDK_FILE" "${SDK_BASE}/${SDK_FILE}"
          wget -O sha256sums "${SDK_BASE}/sha256sums"

          EXPECTED_SHA256="$(
            awk -v target="$SDK_FILE" '
              {
                filename = $NF
                sub(/^\*/, "", filename)
                sub(/^\.\//, "", filename)

                if (filename == target) {
                  print $1
                  exit
                }
              }
            ' sha256sums
          )"

          if ! printf '%s\n' "$EXPECTED_SHA256" |
               grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "Cannot find a valid checksum for: $SDK_FILE"
            exit 1
          fi

          printf '%s  %s\n' "$EXPECTED_SHA256" "$SDK_FILE" |
            sha256sum -c -

          mkdir sdk
          tar --zstd -xf "$SDK_FILE" -C sdk --strip-components=1

      - name: Stage package source into SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sdk/package/custom/luci-app-zerotier

          # .git is staged on purpose: luci.mk derives the translation package
          # version from "git log -1 --format=%ct %h -- po", which must resolve
          # to the audited source commit instead of falling back to "0".
          rsync -a --delete \
            --exclude '.github/' \
            --exclude 'sdk/' \
            ./ sdk/package/custom/luci-app-zerotier/

      - name: Prepare OpenWrt feeds
        shell: bash
        working-directory: sdk
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install luci-base zerotier jsonfilter
          make defconfig

      - name: Build APK
        shell: bash
        working-directory: sdk
        run: |
          set -euo pipefail

          LOG_FILE=build-luci-app-zerotier.log

          # V=s prints every command of every dependency, which is tens of MB and
          # makes GitHub truncate the step log in the web UI. Keep the full log in
          # a file and only echo its tail, so the run view stays readable.
          if make package/custom/luci-app-zerotier/compile V=s > "$LOG_FILE" 2>&1; then
            echo "Build succeeded. Last 200 lines of $LOG_FILE:"
            tail -n 200 "$LOG_FILE"
          else
            echo "Build failed. Last 500 lines of $LOG_FILE:"
            tail -n 500 "$LOG_FILE"
            exit 1
          fi

      - name: Collect results
        shell: bash
        run: |
          set -euo pipefail

          mkdir output

          find sdk/bin -type f \
            \( -name 'luci-app-zerotier-*.apk' \
            -o -name 'luci-i18n-zerotier-zh-cn-*.apk' \) \
            -exec cp -v {} output/ \;

          test -f output/luci-app-zerotier-2.2-r31.apk

          (
            cd output
            sha256sum *.apk > SHA256SUMS
          )

          {
            echo "OpenWrt: ${OPENWRT_VERSION}"
            echo "Target: ${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
            echo "Package source: ${EXPECTED_SOURCE_COMMIT}"
            echo "SDK: ${SDK_FILE}"
          } > output/BUILDINFO

          cat output/SHA256SUMS
          cat output/BUILDINFO

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-zerotier-build-log
          path: sdk/build-luci-app-zerotier.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK files
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-zerotier-openwrt-25.12.5
          path: output/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    # Runs after a successful build, and also when the build was skipped on purpose.
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Resolve artifact source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "Using the artifact built by this run (${{ github.run_id }})."
            exit 0
          fi

          RUN_ID="${{ inputs.run_id }}"

          if [ -n "$RUN_ID" ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
                 --jq '.artifacts[].name' | grep -qx "$ARTIFACT_NAME"; then
              echo "Run $RUN_ID has no $ARTIFACT_NAME artifact."
              exit 1
            fi
          else
            # Publish-only runs succeed without producing an artifact, so walk the
            # recent successful runs and take the first one that actually has it.
            WORKFLOW_FILE="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
            for candidate in $(gh run list \
                 --repo "$GITHUB_REPOSITORY" \
                 --workflow "$WORKFLOW_FILE" \
                 --status success \
                 --limit 30 \
                 --json databaseId \
                 --jq '.[].databaseId'); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" \
                   --jq '.artifacts[].name' | grep -qx "$ARTIFACT_NAME"; then
                RUN_ID="$candidate"
                break
              fi
            done
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful run with the $ARTIFACT_NAME artifact found."
            exit 1
          fi

          gh run view "$RUN_ID" --json databaseId,headSha,conclusion \
            --jq '"using build run \(.databaseId) (\(.conclusion)) at \(.headSha)"'

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: luci-app-zerotier-openwrt-25.12.5
          path: artifact
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Stage release assets
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          find artifact -type f -printf '%P\n' | sort

          APK_NAME="$(basename "$(find artifact -name 'luci-app-zerotier-*.apk' | head -n1)")"
          APK_VERSION="${APK_NAME#luci-app-zerotier-}"
          APK_VERSION="${APK_VERSION%.apk}"

          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${APK_VERSION}"
          fi

          # GitHub rewrites '~' to '.' in asset names, which would no longer match
          # the version string recorded in SHA256SUMS. Stage sanitized copies so
          # asset names, checksums and download URLs all agree.
          rm -rf release
          mkdir -p release

          while IFS= read -r f; do
            cp "$f" "release/$(basename "$f" | tr '~' '-')"
          done < <(find artifact -name '*.apk')

          BUILDINFO="$(find artifact -name BUILDINFO | head -n1 || true)"
          if [ -n "$BUILDINFO" ]; then
            cp "$BUILDINFO" release/
          fi

          ( cd release && sha256sum *.apk > SHA256SUMS )
          cat release/SHA256SUMS

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.stage.outputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "luci-app-zerotier ${TAG#v}" \
              --notes "OpenWrt ${OPENWRT_VERSION} ${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}, package source ${EXPECTED_SOURCE_COMMIT}, build run ${{ steps.source.outputs.run_id }}" \
              --latest
          fi

          # Same tag and same asset names on every run, so the download URL stays
          # stable for devices pulling the APK directly.
          gh release upload "$TAG" release/* --clobber

          # Drop assets this publish no longer produces (e.g. old naming).
          for existing in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            if [ ! -f "release/$existing" ]; then
              gh release delete-asset "$TAG" "$existing" --yes
            fi
          done

          echo "Stable download URLs:"
          for f in release/*.apk release/SHA256SUMS; do
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$f")"
          done
