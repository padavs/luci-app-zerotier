name: Build OpenWrt 25.12.5 APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.5"
  OPENWRT_TARGET: "mediatek"
  OPENWRT_SUBTARGET: "filogic"
  EXPECTED_SOURCE_COMMIT: "c6a223b58e91115ee37812cad6a1b1b54ca0874d"
  SDK_FILE: "openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout fixed source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify audited package source
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e "${EXPECTED_SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_SOURCE_COMMIT" HEAD
          git diff --quiet "$EXPECTED_SOURCE_COMMIT" HEAD -- \
            Makefile htdocs root po LICENSE

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            file \
            wget \
            zlib1g-dev \
            zstd

      - name: Download and verify official SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"

          wget -O "$SDK_FILE" "${SDK_BASE}/${SDK_FILE}"
          wget -O sha256sums "${SDK_BASE}/sha256sums"

          EXPECTED_SHA256="$(
            awk -v target="$SDK_FILE" '
              {
                filename = $NF
                sub(/^\*/, "", filename)
                sub(/^\.\//, "", filename)

                if (filename == target) {
                  print $1
                  exit
                }
              }
            ' sha256sums
          )"

          if ! printf '%s\n' "$EXPECTED_SHA256" |
               grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "Cannot find a valid checksum for: $SDK_FILE"
            exit 1
          fi

          printf '%s  %s\n' "$EXPECTED_SHA256" "$SDK_FILE" |
            sha256sum -c -

          mkdir sdk
          tar --zstd -xf "$SDK_FILE" -C sdk --strip-components=1

      - name: Stage package source into SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sdk/package/custom/luci-app-zerotier

          # .git is staged on purpose: luci.mk derives the translation package
          # version from "git log -1 --format=%ct %h -- po", which must resolve
          # to the audited source commit instead of falling back to "0".
          rsync -a --delete \
            --exclude '.github/' \
            --exclude 'sdk/' \
            ./ sdk/package/custom/luci-app-zerotier/

      - name: Prepare OpenWrt feeds
        shell: bash
        working-directory: sdk
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install luci-base zerotier jsonfilter
          make defconfig

      - name: Build APK
        shell: bash
        working-directory: sdk
        run: |
          set -euo pipefail

          LOG_FILE=build-luci-app-zerotier.log

          # V=s prints every command of every dependency, which is tens of MB and
          # makes GitHub truncate the step log in the web UI. Keep the full log in
          # a file and only echo its tail, so the run view stays readable.
          if make package/custom/luci-app-zerotier/compile V=s > "$LOG_FILE" 2>&1; then
            echo "Build succeeded. Last 200 lines of $LOG_FILE:"
            tail -n 200 "$LOG_FILE"
          else
            echo "Build failed. Last 500 lines of $LOG_FILE:"
            tail -n 500 "$LOG_FILE"
            exit 1
          fi

      - name: Collect results
        shell: bash
        run: |
          set -euo pipefail

          mkdir output

          find sdk/bin -type f \
            \( -name 'luci-app-zerotier-*.apk' \
            -o -name 'luci-i18n-zerotier-zh-cn-*.apk' \) \
            -exec cp -v {} output/ \;

          test -f output/luci-app-zerotier-2.2-r31.apk

          (
            cd output
            sha256sum *.apk > SHA256SUMS
          )

          {
            echo "OpenWrt: ${OPENWRT_VERSION}"
            echo "Target: ${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
            echo "Package source: ${EXPECTED_SOURCE_COMMIT}"
            echo "SDK: ${SDK_FILE}"
          } > output/BUILDINFO

          cat output/SHA256SUMS
          cat output/BUILDINFO

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-zerotier-build-log
          path: sdk/build-luci-app-zerotier.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-zerotier-openwrt-25.12.5
          path: output/
          if-no-files-found: error
          retention-days: 90

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APK_NAME="$(basename "$(ls output/luci-app-zerotier-*.apk | head -n1)")"
          TAG="v${APK_NAME#luci-app-zerotier-}"
          TAG="${TAG%.apk}"

          # GitHub rewrites '~' to '.' in asset names, which would no longer match
          # the version string recorded in SHA256SUMS. Stage sanitized copies so
          # asset names, checksums and download URLs all agree.
          rm -rf release
          mkdir -p release
          for f in output/*.apk; do
            cp "$f" "release/$(basename "$f" | tr '~' '-')"
          done
          cp output/BUILDINFO release/
          ( cd release && sha256sum *.apk > SHA256SUMS )

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "luci-app-zerotier ${TAG#v}" \
              --notes "OpenWrt ${OPENWRT_VERSION} ${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}, package source ${EXPECTED_SOURCE_COMMIT}" \
              --latest
          fi

          # Same tag and same asset names on every run, so the download URL stays
          # stable for devices pulling the APK directly.
          gh release upload "$TAG" release/* --clobber

          # Drop assets this build no longer produces (e.g. old naming).
          for existing in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            if [ ! -f "release/$existing" ]; then
              gh release delete-asset "$TAG" "$existing" --yes
            fi
          done

          echo "Stable download URLs:"
          for f in release/*.apk release/SHA256SUMS; do
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$f")"
          done
